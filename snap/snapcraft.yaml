# snapcraft.yaml
# 2026-10-19
# Version: v1.4.0
#
# PURPOSE:
# Snap package for the Snap Store (Ubuntu and any distribution with snapd).
# Strict confinement: the app can read and write your home folder and
# removable drives, and nothing else. FFmpeg, Tesseract OCR, Pandoc,
# Python, and Tkinter come inside the snap, so nothing else has to be
# installed. Built by .github/workflows/build-linux.yml with snapcraft, for
# x86_64 PCs (amd64) and 64-bit ARM such as the Raspberry Pi 3, 4, and 5
# with 64-bit Raspberry Pi OS (arm64). 32-bit Raspberry Pi OS uses the .deb.
# The Snap Store listing (title, summary, description, links, license) is
# replaced from this file each time a release reaches the stable channel, so
# change it here rather than in the store dashboard. The description is plain
# paragraphs without hard line breaks, because the store keeps every newline.

name: screencap-documentation-tool
title: ScreenCap Docs
summary: Turn screen recordings into step-by-step screenshot documentation
description: |
  A free Steps Recorder replacement from ILHS Software, LLC (formerly Screencap Documentation Tool). Click Record, do the task, and click Stop: ScreenCap Docs finds every step in the recording and saves a screenshot of each one, with a red ring where you clicked and a first-draft caption.

  Review the steps, add captions, arrows, and labels, crop, blur passwords and other sensitive information, and export to HTML, Word, or PowerPoint. Everything runs on your computer, with no telemetry.

  Recordings and output go in Documents/ScreenCap Docs in your home folder by default (an existing Documents/Screencap Documentation Tool folder is kept). Any folder in your home or on a removable drive can be chosen. The built-in recorder needs an X11 session; recordings from any other screen recorder work too.

  Website and downloads for Windows and macOS: https://screencap.ilhs.app
license: MIT
website: https://screencap.ilhs.app
source-code: https://github.com/ILikeHostingServices/Screencap-Documentation-Tool
issues: https://github.com/ILikeHostingServices/Screencap-Documentation-Tool/issues
contact: https://github.com/ILikeHostingServices/Screencap-Documentation-Tool/issues
icon: assets/icon.png
adopt-info: app
base: core24
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:

apps:
  screencap-documentation-tool:
    command: usr/bin/screencap-gui
    desktop: usr/share/applications/io.github.ILikeHostingServices.ScreencapDocumentationTool.desktop
    common-id: io.github.ILikeHostingServices.ScreencapDocumentationTool
    extensions: [gnome]
    # audio-record: the microphone while recording (snap connect it once);
    # the Snap Store asks for audio-playback with it
    plugs: [home, removable-media, network, audio-playback, audio-record]
    environment: &env
      # Tkinter, Tcl/Tk, FFmpeg, and Tesseract staged in the snap
      PYTHONPATH: $SNAP/usr/lib/python3.12:$SNAP/usr/lib/python3.12/lib-dynload:$SNAP/usr/lib/python3/dist-packages
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack:$LD_LIBRARY_PATH
      TCL_LIBRARY: $SNAP/usr/share/tcltk/tcl8.6
      TK_LIBRARY: $SNAP/usr/share/tcltk/tk8.6
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/5/tessdata
  cli:
    command: usr/bin/screencap
    extensions: [gnome]
    plugs: [home, removable-media, network, audio-playback, audio-record]
    environment: *env

parts:
  app:
    plugin: dump
    source: .
    source-type: local
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^RELEASE = "\(.*\)"/\1/p' version.py)"
    override-build: |
      bash packaging/linux/stage.sh "$CRAFT_PART_INSTALL" snap
      # The menu entry starts the snap's own command
      sed -i 's|^Exec=.*|Exec=screencap-documentation-tool|; s|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/io.github.ILikeHostingServices.ScreencapDocumentationTool.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.ILikeHostingServices.ScreencapDocumentationTool.desktop"
    prime:
      - usr/bin/screencap
      - usr/bin/screencap-gui
      - usr/share/screencap-documentation-tool
      - usr/share/applications
      - usr/share/icons
      - usr/share/metainfo
      - usr/share/doc/screencap-documentation-tool
  runtime:
    plugin: nil
    stage-packages:
      - python3
      - python3-tk
      - ffmpeg
      - tesseract-ocr
      - tesseract-ocr-eng
      - pandoc
      - xdg-utils
      - fonts-dejavu-core   # text and numbers on annotations
      - libx11-6            # the built-in recorder: mouse and keys
      - libxtst6
