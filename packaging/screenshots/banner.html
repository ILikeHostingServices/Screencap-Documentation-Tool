<!doctype html>
<!--
  banner.html
  2026-10-30
  Version: v1.0.0

  PURPOSE:
  The Snap Store featured banner (1920 x 640, 3:1), drawn by Chromium in
  make_store_images.sh: the icon, the name, the tagline, and the Steps tab
  screenshot. Colors and fonts follow docs/BRANDING.md. FONTS, ICON, and
  SHOT are filled in by the script.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="FONTS">
<style>
  html, body { margin: 0; width: 1920px; height: 640px; overflow: hidden; }
  body { background: #0f1e3d; color: #fff; font-family: "Source Sans 3", "Segoe UI", sans-serif; position: relative; }
  .glow { position: absolute; inset: 0; background: radial-gradient(900px 500px at 78% 60%, rgba(37, 99, 235, .45), transparent 70%); }
  .copy { position: absolute; left: 120px; top: 0; bottom: 0; width: 800px; display: flex; flex-direction: column; justify-content: center; }
  .name { display: flex; align-items: center; gap: 22px; font: 700 44px "Familjen Grotesk", "Segoe UI", sans-serif; }
  .name img { width: 88px; height: 88px; }
  h1 { margin: 40px 0 0; font: 700 74px/1.05 "Familjen Grotesk", "Segoe UI", sans-serif; letter-spacing: -.01em; }
  p { margin: 28px 0 0; font-size: 28px; line-height: 1.3; color: #c7d3ea; }
  .shot { position: absolute; left: 960px; top: 70px; width: 1100px; border-radius: 14px; overflow: hidden;
          box-shadow: 0 30px 80px rgba(0, 0, 0, .45); border: 2px solid rgba(255, 255, 255, .15); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="name"><img src="ICON" alt="">ScreenCap Docs</div>
    <h1>Record a task once.<br>Get the how-to guide.</h1>
    <p>Free Steps Recorder replacement for Windows, Linux, and macOS</p>
  </div>
  <div class="shot"><img src="SHOT" alt=""></div>
</body>
</html>
