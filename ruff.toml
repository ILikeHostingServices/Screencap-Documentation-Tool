# ruff.toml
# 2026-10-17
# Version: v1.0.0
#
# PURPOSE:
# The coding standard for the Python code: PEP 8 as checked by Ruff's
# default rules (pycodestyle errors E4, E7, E9 and Pyflakes F). CI fails on
# any finding (.github/workflows/ci.yml); see CONTRIBUTING.md.

extend-exclude = ["build", "whisper-env", "output", "source"]

[lint]
# Short guard clauses on one line (`if not x: return`) are the house style
ignore = ["E701", "E702"]
