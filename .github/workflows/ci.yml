# ci.yml
# 2026-10-17
# Version: v1.4.0
#
# PURPOSE:
# Runs the automated tests on real Windows and Linux machines for every push
# and pull request: code checks, the full test suite (engine, blurring,
# export, presets, VLC, captions from narration with a real speech model,
# the built-in recorder recording real clicks, PowerPoint files checked
# with Microsoft's Open XML SDK),
# and the GUI test that drives the real window.
# Code style is checked with Ruff (see CONTRIBUTING.md). Statement coverage
# is measured on both systems and combined; it must stay at 80% or more.
# Every optional tool is installed, and the run fails if any test was
# skipped, so a missing tool can never let a test pass silently.
#
# Read-only: the workflow token can read the code and nothing else, and no
# secrets are used. GitHub Actions is free for public repositories.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SCREENCAP_TEST_VLC: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg, Tesseract, Pandoc, VLC (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg tesseract pandoc vlc -y --no-progress
          # Tesseract, Pandoc, and VLC install to Program Files without
          # touching PATH; the tool finds them there, like on a real PC

      - name: Install FFmpeg, Tesseract, Pandoc, VLC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr pandoc vlc xvfb libxtst6
          # Ubuntu blocks Chrome's sandbox for unprivileged users on CI
          echo "SCREENCAP_NO_SANDBOX=1" >> "$GITHUB_ENV"

      - name: Install speech recognition and a speech sample
        run: |
          # Same layout as the installers: faster-whisper in its own venv
          T="$RUNNER_TEMP"
          [ "$RUNNER_OS" = "Windows" ] && T="$(cygpath -u "$RUNNER_TEMP")"
          python -m venv "$T/whisper-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            WPY="$T/whisper-env/Scripts/python.exe"
          else
            WPY="$T/whisper-env/bin/python"
          fi
          "$WPY" -m pip install --disable-pip-version-check --quiet faster-whisper
          "$WPY" -c "import faster_whisper; print('faster-whisper', faster_whisper.__version__)"
          # A short public speech sample (JFK, "ask not what your country...")
          # from the MIT-licensed whisper.cpp repository
          curl -fsSL -o "$T/jfk.wav" \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          SPEECH="$T/jfk.wav"
          if [ "$RUNNER_OS" = "Windows" ]; then   # Python needs Windows paths
            WPY="$(cygpath -w "$WPY")"
            SPEECH="$(cygpath -w "$SPEECH")"
          fi
          {
            echo "SCREENCAP_WHISPER_PYTHON=$WPY"
            echo "SCREENCAP_TEST_WHISPER=1"
            echo "SCREENCAP_TEST_SPEECH=$SPEECH"
          } >> "$GITHUB_ENV"

      - name: Install the PowerPoint checks (python-pptx and the Open XML SDK)
        run: |
          # python-pptx reads the exported presentations back; the Open XML
          # SDK checks them against the rules Office itself uses
          python -m pip install --disable-pip-version-check --quiet python-pptx
          T="$RUNNER_TEMP"
          [ "$RUNNER_OS" = "Windows" ] && T="$(cygpath -u "$RUNNER_TEMP")"
          dotnet build tests/ooxml -c Release -o "$T/ooxml" --nologo -v quiet
          DLL="$T/ooxml/OoxmlValidator.dll"
          [ "$RUNNER_OS" = "Windows" ] && DLL="$(cygpath -m "$DLL")"
          echo "SCREENCAP_OOXML_VALIDATOR=dotnet \"$DLL\"" >> "$GITHUB_ENV"
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"

      - name: Check code style (Ruff)
        run: |
          python -m pip install --quiet "ruff==0.15.20"
          python -m ruff check --output-format github .

      - name: Check shell installer
        if: runner.os == 'Linux'
        run: |
          shellcheck install.sh
          bash -n install.sh

      - name: Check PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in 'install.ps1', 'Install-Prerequisites.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Host "::error file=$f::$($_.Message)" }; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Show tool versions
        run: |
          python --version
          python -c "import screencap, redact, export, player; print('ffmpeg:', screencap.find_tool('ffmpeg')); print('tesseract:', redact.find_tesseract()); print('pandoc:', export.find_pandoc()); print('browser:', export.find_browser()); print('vlc:', player.find_vlc())"
          python -c "import transcribe; print('speech recognition:', transcribe.find_python())"

      - name: Run tests (with coverage)
        run: |
          set -o pipefail
          python -m pip install --quiet "coverage==7.16.2"
          # Absolute paths, so the app processes the GUI tests start record too
          COVERAGE_SOURCE="$PWD"
          COVERAGE_DATA_DIR="$RUNNER_TEMP/coverage"
          if [ "$RUNNER_OS" = "Windows" ]; then
            COVERAGE_SOURCE="$(cygpath -m "$PWD")"
            COVERAGE_DATA_DIR="$(cygpath -m "$RUNNER_TEMP")/coverage"
          fi
          export COVERAGE_SOURCE COVERAGE_DATA_DIR
          mkdir -p "$COVERAGE_DATA_DIR"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m coverage run -m unittest discover -s tests -v 2>&1 | tee test.log
          else
            python -m coverage run -m unittest discover -s tests -v 2>&1 | tee test.log
          fi
          python -m coverage combine -q
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          cp "$COVERAGE_DATA_DIR/.coverage" "coverage-${{ runner.os }}.data"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ runner.os }}
          path: coverage-${{ runner.os }}.data
          include-hidden-files: true
          retention-days: 7

      - name: Fail if any test was skipped
        run: |
          # unittest marks a skipped test "... skipped 'reason'" and ends with
          # "OK (skipped=N)"; the tool's own "skipped=0" summary is not a skip
          if grep -E "\.\.\. skipped|^(OK|FAILED) \(.*skipped=" test.log; then
            echo "::error::Some tests were skipped (a tool is missing on this runner). See the lines above."
            exit 1
          fi

  coverage:
    name: Coverage (80% minimum)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: cov

      - name: Combine Windows and Linux and check the minimum
        run: |
          python -m pip install --quiet "coverage==7.16.2"
          export COVERAGE_DATA_DIR="$PWD"
          for f in cov/*.data; do cp "$f" ".coverage.$(basename "$f" .data)"; done
          python -m coverage combine -q
          {
            echo "### Statement coverage, Windows and Linux combined"
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --fail-under=80
