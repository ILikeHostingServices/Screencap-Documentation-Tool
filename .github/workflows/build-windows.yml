# build-windows.yml
# 2026-10-10
# Version: v1.3.0
#
# PURPOSE:
# Builds the packaged Windows app (PyInstaller, see packaging/screencap.spec)
# on a real Windows machine, tests the built programs, packs them as a
# portable zip and as an installer (Inno Setup, see packaging/installer.iss),
# tests installing and uninstalling for one user and for all users and
# upgrading from v1.16.0 (which used another folder), and
# writes a SHA256SUMS.txt checksum file, and checks that the winget manifest
# for the build is valid (winget.yml publishes it for releases).
#   - Pull requests, pushes to main, and manual runs: build and test; the
#     files are kept as a workflow artifact for 30 days.
#   - Called by the release workflow with a release tag (or run by hand with
#     one): builds that tag and attaches the files to its GitHub release.
# The programs are not code signed yet (see HANDOFF.md).

name: Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and attach files to (empty = just build)"
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

concurrency:
  group: windows-build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !inputs.release_tag }}

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read the version
        id: version
        run: |
          $v = (Select-String -Path version.py -Pattern '^RELEASE = "(.+)"').Matches[0].Groups[1].Value
          if ('${{ inputs.release_tag }}' -and "v$v" -ne '${{ inputs.release_tag }}') {
            throw "version.py says $v but the release tag is ${{ inputs.release_tag }}"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building v$v"

      - name: Install PyInstaller and FFmpeg (FFmpeg only for the tests)
        run: |
          python -m pip install --disable-pip-version-check --quiet "pyinstaller>=6.10,<7"
          python -m PyInstaller --version
          choco install ffmpeg -y --no-progress

      - name: Build
        run: |
          python packaging/make_version_info.py build/version_info.txt
          python -m PyInstaller packaging/screencap.spec --noconfirm --clean --log-level WARN
          $app = 'dist\Screencap-Documentation-Tool'
          foreach ($f in 'Screencap Documentation Tool.exe', 'screencap.exe', '_internal\assets\icon.ico', '_internal\whisper_worker.py', '_internal\LICENSE') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "Missing from the build: $f" }
          }
          Get-ChildItem $app | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - name: Test the command line program
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + $env:Path
          $v = '${{ steps.version.outputs.version }}'
          $cli = Resolve-Path 'dist\Screencap-Documentation-Tool\screencap.exe'
          $out = & $cli --version
          Write-Host $out
          if ($out -notmatch [regex]::Escape("v$v")) { throw "Expected v$v, got: $out" }
          $info = (Get-Item $cli).VersionInfo
          Write-Host "File version: $($info.ProductVersion) | $($info.CompanyName) | $($info.FileDescription)"
          if ($info.ProductVersion -ne $v) { throw "Windows version resource says $($info.ProductVersion), expected $v" }

          # With no folders given, the packaged app uses Documents
          & $cli
          $docs = [Environment]::GetFolderPath('MyDocuments')
          if (-not (Test-Path (Join-Path $docs 'Screencap Documentation Tool\source'))) { throw 'Default source folder was not created in Documents' }

          # Process and export a synthetic recording
          $src = Join-Path $env:RUNNER_TEMP 'src'; $dst = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force $src | Out-Null
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=white:s=1280x720:r=30:d=12 `
            -vf "drawbox=x=300:y=200:w=600:h=300:color=gray:t=fill:enable='gte(t,4)'" `
            -c:v libx264 -pix_fmt yuv420p (Join-Path $src 'CI Demo.mp4')
          & $cli -s $src -o $dst --export html,pdf
          if ($LASTEXITCODE -ne 0) { throw "screencap.exe failed ($LASTEXITCODE)" }
          foreach ($f in 'steps.md', 'export\CI Demo.html', 'export\CI Demo.pdf') {
            if (-not (Test-Path (Join-Path $dst "CI Demo\$f"))) { throw "Missing output: $f" }
          }

      - name: Test the GUI program starts
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $gui = Resolve-Path 'dist\Screencap-Documentation-Tool\Screencap Documentation Tool.exe'
          $p = Start-Process -FilePath $gui -PassThru
          $title = ''
          for ($i = 0; $i -lt 30 -and -not $title; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { throw "The GUI exited early (exit code $($p.ExitCode))" }
            $title = $p.MainWindowTitle
          }
          Write-Host "Window title: $title"
          Stop-Process -Id $p.Id -Force
          if ($title -ne "Screencap Documentation Tool v$v") { throw "Unexpected or missing window title: '$title'" }

      - name: Pack the portable zip
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path 'dist\Screencap-Documentation-Tool' `
            -DestinationPath "release\Screencap-Documentation-Tool-v$v-windows-x64-portable.zip"

      - name: Build the installer
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
                    Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Inno Setup: $iscc"
          & $iscc "/DAppVersion=$v" /Qp packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          $setup = "release\Screencap-Documentation-Tool-v$v-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Installer not created: $setup" }
          $info = (Get-Item $setup).VersionInfo
          Write-Host "Installer version: $($info.ProductVersion) | $($info.CompanyName)"

      - name: Test installing and uninstalling
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.version.outputs.version }}'
          $setup = Resolve-Path "release\Screencap-Documentation-Tool-v$v-windows-x64-setup.exe"
          $name = 'Screencap Documentation Tool'
          $appId = 'ILHS.ScreencapDocumentationTool.GUI'

          function Test-Shortcut($folder) {
            $lnk = Join-Path $folder "$name.lnk"
            if (-not (Test-Path $lnk)) { throw "Shortcut missing: $lnk" }
            $item = (New-Object -ComObject Shell.Application).Namespace($folder).ParseName("$name.lnk")
            $id = $item.ExtendedProperty('System.AppUserModel.ID')
            if ($id -ne $appId) { throw "Shortcut taskbar ID is '$id', expected $appId" }
          }
          function Wait-Gone($path) {
            # The uninstaller hands over to a copy of itself, so wait for the files
            for ($i = 0; $i -lt 60 -and (Test-Path $path); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path $path) { throw "Still present after uninstalling: $path" }
          }

          foreach ($scope in 'CURRENTUSER', 'ALLUSERS') {
            Write-Host "=== Install for $scope ==="
            $log = Join-Path $env:RUNNER_TEMP "setup-$scope.log"
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/$scope", '/TASKS=desktopicon', "/LOG=`"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 30; throw "Setup failed for $scope ($($p.ExitCode))" }
            if ($scope -eq 'CURRENTUSER') {
              $dir = Join-Path $env:LOCALAPPDATA 'Programs\ILHS\Screencap-Documentation-Tool'
              $menu = [Environment]::GetFolderPath('Programs'); $desk = [Environment]::GetFolderPath('Desktop')
            } else {
              $dir = Join-Path $env:ProgramFiles 'ILHS\Screencap-Documentation-Tool'
              $menu = [Environment]::GetFolderPath('CommonPrograms'); $desk = [Environment]::GetFolderPath('CommonDesktopDirectory')
            }
            if (-not (Test-Path (Join-Path $dir 'screencap.exe'))) { throw "Not installed in $dir" }
            $out = & (Join-Path $dir 'screencap.exe') --version
            Write-Host $out
            if ($out -notmatch [regex]::Escape("v$v")) { throw "Installed version is wrong: $out" }
            Test-Shortcut $menu
            Test-Shortcut $desk
            $reg = if ($scope -eq 'CURRENTUSER') { 'HKCU:' } else { 'HKLM:' }
            $entry = Get-ChildItem "$reg\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
                     Get-ItemProperty | Where-Object DisplayName -eq $name
            if (-not $entry) { throw "No Apps & Features entry for $scope" }
            Write-Host "Apps & Features: $($entry.DisplayName) $($entry.DisplayVersion) by $($entry.Publisher)"

            Write-Host "=== Uninstall for $scope ==="
            Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
            Wait-Gone (Join-Path $dir "$name.exe")
            Wait-Gone (Join-Path $menu "$name.lnk")
            Wait-Gone (Join-Path $desk "$name.lnk")
            Wait-Gone (Split-Path $dir)             # the empty ILHS folder goes too
          }

      - name: Test upgrading from v1.16.0 (installed in another folder)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.version.outputs.version }}'
          $setup = Resolve-Path "release\Screencap-Documentation-Tool-v$v-windows-x64-setup.exe"
          $name = 'Screencap Documentation Tool'
          $old = Join-Path $env:RUNNER_TEMP 'old'
          gh release download v1.16.0 --dir $old --pattern '*-windows-x64-setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the v1.16.0 installer' }
          $oldSetup = Get-ChildItem $old -Filter '*-setup.exe' | Select-Object -First 1
          foreach ($case in @(
              @{ Scope = 'CURRENTUSER'; Old = (Join-Path $env:LOCALAPPDATA "Programs\$name");
                 New = (Join-Path $env:LOCALAPPDATA 'Programs\ILHS\Screencap-Documentation-Tool') },
              @{ Scope = 'ALLUSERS'; Old = (Join-Path $env:ProgramFiles $name);
                 New = (Join-Path $env:ProgramFiles 'ILHS\Screencap-Documentation-Tool') })) {
            Write-Host "=== $($case.Scope): v1.16.0 in $($case.Old), then v$v ==="
            $p = Start-Process $oldSetup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/$($case.Scope)" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "v1.16.0 setup failed ($($p.ExitCode))" }
            if (-not (Test-Path (Join-Path $case.Old 'screencap.exe'))) { throw "v1.16.0 is not in $($case.Old)" }
            $log = Join-Path $env:RUNNER_TEMP "upgrade-$($case.Scope).log"
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/$($case.Scope)", "/LOG=`"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 30; throw "Upgrade failed ($($p.ExitCode))" }
            for ($i = 0; $i -lt 60 -and (Test-Path $case.Old); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path $case.Old) { Get-Content $log -Tail 30; throw "The old copy is still in $($case.Old)" }
            $out = & (Join-Path $case.New 'screencap.exe') --version
            if ($out -notmatch [regex]::Escape("v$v")) { throw "Upgraded copy reports: $out" }
            $reg = if ($case.Scope -eq 'CURRENTUSER') { 'HKCU:' } else { 'HKLM:' }
            $entries = @(Get-ChildItem "$reg\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
                         Get-ItemProperty | Where-Object DisplayName -eq $name)
            if ($entries.Count -ne 1 -or $entries[0].DisplayVersion -ne $v) { throw "Expected one Apps & Features entry for v$v, found: $($entries | ForEach-Object DisplayVersion)" }
            Write-Host "Moved to $($case.New): $out"
            Start-Process (Join-Path $case.New 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
            for ($i = 0; $i -lt 60 -and (Test-Path $case.New); $i++) { Start-Sleep -Seconds 1 }
          }

      - name: Write checksums
        run: |
          Get-ChildItem release -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Path release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt
          Get-ChildItem release | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - name: Validate the winget manifest
        run: |
          $v = '${{ steps.version.outputs.version }}'
          python packaging/make_winget_manifests.py --version $v `
            --installer "release\Screencap-Documentation-Tool-v$v-windows-x64-setup.exe" --out build\winget
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw 'winget is not available on this runner' }
          winget validate --manifest "build\winget\$v" --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-build-v${{ steps.version.outputs.version }}
          path: release/
          retention-days: 30

  attach:
    name: Attach to the release
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-build-v${{ needs.build.outputs.version }}
          path: release
      - name: Upload the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l release
          gh release upload "${{ inputs.release_tag }}" release/* --clobber
          gh release view "${{ inputs.release_tag }}" --json assets --jq '.assets[].name'
