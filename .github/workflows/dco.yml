# dco.yml
# 2026-10-17
# Version: v1.0.0
#
# PURPOSE:
# Checks that every commit in a pull request is signed off
# (a "Signed-off-by: Name <email>" line matching the commit's author),
# which certifies the Developer Certificate of Origin
# (https://developercertificate.org/). See CONTRIBUTING.md. Merge commits
# and commits from bots such as Dependabot are exempt.
#
# Read-only: no secrets are used. The commit range is passed through
# environment variables, never pasted into the script.

name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            case "$author" in *"[bot]"*) continue ;; esac
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "OK       $(git log -1 --format='%h %s' "$c")"
            else
              echo "::error::Commit $(git log -1 --format='%h' "$c") is not signed off by its author ($author). Fix with: git rebase --signoff $BASE"
              missing=1
            fi
          done
          exit "$missing"
