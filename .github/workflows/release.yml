# release.yml
# 2026-10-10
# Version: v1.7.0
#
# PURPOSE:
# 1. Creates any annotated version tag listed in .github/releases/manifest.txt
#    that does not exist yet, using .github/releases/<tag>.md as the message.
# 2. Publishes a GitHub release for every version tag that does not have one
#    yet, using the annotated tag's message as the release notes, and marks
#    the highest version as "Latest".
# 3. Builds the packaged Windows app for the newest release (when that
#    version includes packaging/screencap.spec) and attaches the files,
#    unless they are attached already (see build-windows.yml).
# 4. Then publishes that release to winget (see winget.yml).
# 5. Builds the Linux packages for the newest release (when that version
#    includes packaging/linux/) and attaches them, unless they are
#    attached already; then updates the AUR and the Snap Store when their
#    secrets are set (see build-linux.yml).
# Versions are Major.Minor.Patch only (vX.Y.Z); anything else is rejected.
# A tag that cannot be created is reported and the others still go ahead.
# GitHub refuses a tag on a commit whose .github/workflows/ files differ from
# the newest commit's (the workflow token may not change workflows); point
# such a version at a commit with the current workflow files instead.
# Runs when a tag is pushed, or by hand (Actions > Publish releases > Run
# workflow). Safe to re-run: finished work is skipped. It only ever creates
# tags and releases. It never deletes or rewrites existing ones; the only
# change to an existing release is moving the "Latest" label to the newest.

name: Publish releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-releases
  cancel-in-progress: false

env:
  TAGGER_NAME: ILHS-Owner
  TAGGER_EMAIL: 337515992+ILHS-Owner@users.noreply.github.com
  VERSION_RE: '^v[0-9]+\.[0-9]+\.[0-9]+$'

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.releases.outputs.build_tag }}
      linux_tag: ${{ steps.releases.outputs.linux_tag }}
      failed_tags: ${{ steps.tags.outputs.failed_tags }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create missing tags from the release manifest
        id: tags
        run: |
          set -euo pipefail
          # Re-fetch tags so annotated tags keep their messages (checkout can
          # replace the triggering tag with a lightweight one)
          git fetch --force --tags origin
          manifest=.github/releases/manifest.txt
          [ -f "$manifest" ] || { echo "No manifest; nothing to tag."; exit 0; }
          failed=""
          while read -r tag sha; do
            [ -n "${tag:-}" ] || continue
            if ! [[ "$tag" =~ $VERSION_RE ]]; then
              echo "::error::$tag is not a Major.Minor.Patch version (vX.Y.Z)"; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag exists: $tag"
              continue
            fi
            notes=".github/releases/$tag.md"
            [ -f "$notes" ] || { echo "::error::Missing notes file $notes"; exit 1; }
            git cat-file -e "$sha^{commit}" || { echo "::error::$tag points at unknown commit $sha"; exit 1; }
            echo "Creating tag: $tag -> $sha"
            git -c user.name="$TAGGER_NAME" -c user.email="$TAGGER_EMAIL" \
              tag -a "$tag" "$sha" --cleanup=whitespace -F "$notes"
            if ! git push origin "refs/tags/$tag"; then
              echo "::error::Could not push $tag (see the note at the top of release.yml)"
              git tag -d "$tag" >/dev/null
              failed="$failed $tag"
            fi
          done < <(grep -v '^\s*#' "$manifest")
          # Publish what worked, then fail so the missing tags are noticed
          echo "failed_tags=${failed# }" >> "$GITHUB_OUTPUT"

      - name: Create missing releases and mark the newest as Latest
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags="$(git tag -l 'v[0-9]*' --sort=v:refname | grep -E "$VERSION_RE" || true)"
          for tag in $tags; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release exists: $tag"
              continue
            fi
            subject="$(git tag -l --format='%(contents:subject)' "$tag")"
            git tag -l --format='%(contents:body)' "$tag" > notes.md
            echo "Creating release: $tag"
            # --latest=false here; "Latest" is set explicitly below so an older
            # version published later never takes it over
            gh release create "$tag" --verify-tag --latest=false \
              --title "$tag - $subject" --notes-file notes.md
          done
          newest="$(printf '%s\n' $tags | tail -n1)"
          if [ -n "$newest" ]; then
            echo "Marking $newest as Latest"
            gh release edit "$newest" --latest
            # Packaged Windows build: only versions that have the recipe, and
            # only when the files are not attached yet
            if git cat-file -e "$newest:packaging/screencap.spec" 2>/dev/null \
               && ! gh release view "$newest" --json assets --jq '.assets[].name' | grep -q 'windows-x64-portable.zip'; then
              echo "Windows build needed for $newest"
              echo "build_tag=$newest" >> "$GITHUB_OUTPUT"
            fi
            if git cat-file -e "$newest:packaging/linux/build_packages.py" 2>/dev/null \
               && ! gh release view "$newest" --json assets --jq '.assets[].name' | grep -q '_all\.deb$'; then
              echo "Linux packages needed for $newest"
              echo "linux_tag=$newest" >> "$GITHUB_OUTPUT"
            fi
          fi

  windows:
    name: Windows build
    needs: publish
    if: needs.publish.outputs.build_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      release_tag: ${{ needs.publish.outputs.build_tag }}

  winget:
    name: Publish to winget
    needs: [publish, windows]
    if: needs.publish.outputs.build_tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/winget.yml
    with:
      release_tag: ${{ needs.publish.outputs.build_tag }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  linux:
    name: Linux packages
    needs: publish
    if: needs.publish.outputs.linux_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build-linux.yml
    with:
      release_tag: ${{ needs.publish.outputs.linux_tag }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  missing-tags:
    name: Report tags that could not be created
    needs: [publish, windows, winget, linux]
    if: always() && needs.publish.outputs.failed_tags != ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Not created: ${{ needs.publish.outputs.failed_tags }}. Point these versions at a commit whose .github/workflows/ files match main's (see release.yml)."
          exit 1
