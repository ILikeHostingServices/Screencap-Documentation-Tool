# dependency-review.yml
# 2026-10-17
# Version: v1.0.0
#
# PURPOSE:
# Blocks a pull request that adds or updates a dependency (a Python
# package or a GitHub Action) with a known vulnerability of high or critical
# severity, as SECURITY.md's dependency policy requires. Uses GitHub's
# dependency graph and advisory database; free for public repositories.
#
# Read-only: no secrets are used.

name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: high
