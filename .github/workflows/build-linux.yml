# build-linux.yml
# 2026-10-10
# Version: v1.0.0
#
# PURPOSE:
# Builds the Linux packages and tests each one on the distributions it is
# for, by installing it in a clean container, processing a recording with
# the command line program, opening the GUI, and uninstalling it:
#   - .deb  (packaging/linux/build_packages.py): Ubuntu 24.04 and 22.04, Debian 12
#   - .rpm  (same script): Fedora, Rocky Linux 9 (RHEL rebuild, with RPM
#           Fusion for FFmpeg), openSUSE Tumbleweed
#   - Arch  (packaging/aur/PKGBUILD.in, built with makepkg): Arch Linux
#   - snap  (snap/snapcraft.yaml): installed with snapd on Ubuntu
# Pull requests, pushes to main, and manual runs: build and test only.
# Called by the release workflow with a release tag (or run by hand with
# one): also attaches the files and SHA256SUMS-linux.txt to that release,
# then publishes to the AUR and the Snap Store when their secrets are set
# (AUR_SSH_PRIVATE_KEY, SNAPCRAFT_STORE_CREDENTIALS; see HANDOFF.md).

name: Linux build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and attach files to (empty = just build)"
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false

concurrency:
  group: linux-build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !inputs.release_tag }}

permissions:
  contents: read

jobs:
  packages:
    name: Build .deb and .rpm
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Read the version
        id: version
        run: |
          v="$(sed -n 's/^RELEASE = "\(.*\)"/\1/p' version.py)"
          if [ -n "${{ inputs.release_tag }}" ] && [ "v$v" != "${{ inputs.release_tag }}" ]; then
            echo "::error::version.py says $v but the release tag is ${{ inputs.release_tag }}"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building v$v"

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          "$(go env GOPATH)/bin/nfpm" --version | tail -n 3

      - name: Check the desktop entry and software center details
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils appstream >/dev/null
          desktop-file-validate packaging/linux/*.desktop
          appstreamcli validate --no-net --explain packaging/linux/*.metainfo.xml

      - name: Build the packages
        run: |
          python3 packaging/linux/build_packages.py --out release --nfpm "$(go env GOPATH)/bin/nfpm"
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb-rpm
          path: release/
          retention-days: 30

  arch:
    name: Build the Arch package
    runs-on: ubuntu-latest
    needs: packages
    container: archlinux:latest
    steps:
      - name: Install the build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Build with makepkg from the source archive
        run: |
          git config --global --add safe.directory "$PWD"
          v='${{ needs.packages.outputs.version }}'
          git archive --format=tar.gz --prefix="Screencap-Documentation-Tool-$v/" -o "/tmp/source-$v.tar.gz" HEAD
          packaging/aur/make_pkgbuild.sh "$v" /tmp/pkg "/tmp/source-$v.tar.gz"
          chown -R builder /tmp/pkg
          cd /tmp/pkg
          sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/release/"
          ls -l "$GITHUB_WORKSPACE/release"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arch
          path: release/
          retention-days: 30

  test:
    name: Test on ${{ matrix.name }}
    needs: [packages, arch]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04, image: "ubuntu:24.04", family: deb }
          - { name: Ubuntu 22.04, image: "ubuntu:22.04", family: deb }
          - { name: Debian 12, image: "debian:12", family: deb }
          - { name: Fedora, image: "fedora:latest", family: fedora }
          - { name: Rocky Linux 9, image: "rockylinux/rockylinux:9", family: rhel }
          - { name: openSUSE Tumbleweed, image: "opensuse/tumbleweed:latest", family: suse }
          - { name: Arch Linux, image: "archlinux:latest", family: arch }
    env:
      V: ${{ needs.packages.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.family == 'arch' && 'linux-arch' || 'linux-deb-rpm' }}
          path: pkg

      - name: Install the package (dependencies come from the distribution)
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.family }}" in
            deb)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq ./pkg/*.deb xvfb ;;
            fedora)
              dnf install -y ./pkg/*.rpm xorg-x11-server-Xvfb ;;
            rhel)
              # FFmpeg is not in RHEL; RPM Fusion has it (needs EPEL and CRB)
              dnf install -y epel-release dnf-plugins-core
              dnf config-manager --set-enabled crb
              dnf install -y "https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-9.noarch.rpm"
              dnf install -y ./pkg/*.rpm xorg-x11-server-Xvfb ;;
            suse)
              zypper --non-interactive install --allow-unsigned-rpm ./pkg/*.rpm xorg-x11-server-Xvfb ;;
            arch)
              pacman -Syu --noconfirm
              pacman -U --noconfirm ./pkg/*.pkg.tar.zst
              pacman -S --noconfirm --needed xorg-server-xvfb ;;
          esac

      - name: Test the command line program
        shell: bash
        run: |
          set -euxo pipefail
          out="$(/usr/bin/screencap --version)"
          echo "$out"
          grep -q "v$V" <<< "$out"
          test -f /usr/share/applications/io.github.ILikeHostingServices.ScreencapDocumentationTool.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/io.github.ILikeHostingServices.ScreencapDocumentationTool.png
          export HOME=/tmp/home && mkdir -p "$HOME"
          # A recording with two steps (FFV1 in Matroska: built into every
          # distribution's FFmpeg, including Fedora's patent-free build)
          mkdir -p /tmp/src
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=white:s=640x360:r=10:d=8 \
            -vf "drawbox=x=150:y=100:w=300:h=150:color=gray:t=fill:enable='gte(t,3)'" \
            -c:v ffv1 /tmp/src/Demo.mkv
          /usr/bin/screencap -s /tmp/src -o /tmp/out
          test -f /tmp/out/Demo/steps.md
          ls /tmp/out/Demo
          [ "$(ls /tmp/out/Demo/*.png | wc -l)" -ge 2 ]
          # With no folders given, a package install uses ~/Documents
          /usr/bin/screencap
          test -d "$HOME/Documents/Screencap Documentation Tool/source"

      - name: Test the GUI program starts
        shell: bash
        run: |
          set -euxo pipefail
          export HOME=/tmp/home
          Xvfb :99 -screen 0 1400x900x24 >/dev/null 2>&1 &
          sleep 3
          title="$(DISPLAY=:99 timeout 90 /usr/bin/screencap-gui --smoke-test)"
          echo "Window title: $title"
          [ "$title" = "Screencap Documentation Tool v$V" ]

      - name: Test uninstalling
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.family }}" in
            deb) apt-get remove -y screencap-documentation-tool ;;
            fedora|rhel) dnf remove -y screencap-documentation-tool ;;
            suse) zypper --non-interactive remove screencap-documentation-tool ;;
            arch) pacman -R --noconfirm screencap-documentation-tool ;;
          esac
          ! test -e /usr/bin/screencap
          ! test -e /usr/share/screencap-documentation-tool

  snap:
    name: Build and test the snap
    needs: packages
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.packages.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - uses: snapcore/action-build@v1
        id: build

      - name: Install and test the snap
        run: |
          set -euxo pipefail
          snap="${{ steps.build.outputs.snap }}"
          ls -l "$snap"
          sudo snap install --dangerous "$snap"
          snap connections screencap-documentation-tool
          out="$(screencap-documentation-tool.cli --version)"
          echo "$out"
          grep -q "v$V" <<< "$out"
          # Recordings in the home folder (the home interface)
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb >/dev/null
          mkdir -p "$HOME/snaptest/src"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=white:s=640x360:r=10:d=8 \
            -vf "drawbox=x=150:y=100:w=300:h=150:color=gray:t=fill:enable='gte(t,3)'" \
            -c:v libx264 -pix_fmt yuv420p "$HOME/snaptest/src/Demo.mp4"
          screencap-documentation-tool.cli -s "$HOME/snaptest/src" -o "$HOME/snaptest/out"
          test -f "$HOME/snaptest/out/Demo/steps.md"
          [ "$(ls "$HOME"/snaptest/out/Demo/*.png | wc -l)" -ge 2 ]
          # The GUI
          Xvfb :99 -screen 0 1400x900x24 >/dev/null 2>&1 &
          sleep 3
          title="$(DISPLAY=:99 timeout 120 screencap-documentation-tool --smoke-test)"
          echo "Window title: $title"
          [ "$title" = "Screencap Documentation Tool v$V" ]
          sudo snap remove screencap-documentation-tool
          mkdir -p release
          cp "$snap" "release/screencap-documentation-tool_${V}_amd64.snap"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-snap
          path: release/
          retention-days: 30

  attach:
    name: Attach to the release
    needs: [packages, test, snap]
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: linux-*
          path: release
          merge-multiple: true
      - name: Upload the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -- *.deb *.rpm *.pkg.tar.zst *.snap | sort -k2 > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
          gh release upload "${{ inputs.release_tag }}" ./* --clobber
          gh release view "${{ inputs.release_tag }}" --json assets --jq '.assets[].name'

  aur:
    name: Publish to the AUR
    needs: [packages, attach]
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - name: Push the PKGBUILD to aur.archlinux.org
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::No AUR_SSH_PRIVATE_KEY secret, so the AUR was not updated (see HANDOFF.md)."
            exit 0
          fi
          pacman -Syu --noconfirm --needed base-devel git openssh
          useradd -m builder
          v='${{ needs.packages.outputs.version }}'
          packaging/aur/make_pkgbuild.sh "$v" /tmp/aur-new
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n' > ~/.ssh/config
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          git clone ssh://aur@aur.archlinux.org/screencap-documentation-tool.git /tmp/aur
          cp /tmp/aur-new/PKGBUILD /tmp/aur/PKGBUILD
          chown -R builder /tmp/aur
          (cd /tmp/aur && sudo -u builder makepkg --printsrcinfo > .SRCINFO)
          cd /tmp/aur
          git config user.name 'ILHS-Owner'
          git config user.email '337515992+ILHS-Owner@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "The AUR already has v$v."; exit 0; fi
          git commit -m "Update to $v"
          git push origin HEAD:master
          echo "AUR updated to $v: https://aur.archlinux.org/packages/screencap-documentation-tool"

  snapstore:
    name: Publish to the Snap Store
    needs: [packages, attach]
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-snap
          path: release
      - name: Check for the Snap Store credentials
        id: creds
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "${SNAPCRAFT_STORE_CREDENTIALS:-}" ]; then
            echo "::warning::No SNAPCRAFT_STORE_CREDENTIALS secret, so the Snap Store was not updated (see HANDOFF.md)."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: snapcore/action-publish@v1
        if: steps.creds.outputs.set == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: release/screencap-documentation-tool_${{ needs.packages.outputs.version }}_amd64.snap
          release: stable
