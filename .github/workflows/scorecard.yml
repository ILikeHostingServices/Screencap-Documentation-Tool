# scorecard.yml
# 2026-10-16
# Version: v1.0.0
#
# PURPOSE:
# OpenSSF Scorecard: rates the repository's security practices (pinned
# dependencies, branch protection, code review, signed releases, and so
# on) every week and after each push to main. Results appear under the
# Security tab and on the public Scorecard site (the README badge).

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 3"     # Wednesdays 08:23 UTC (04:23 US Eastern)
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the results to code scanning
      id-token: write          # publish the results to the Scorecard site
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: results.sarif
