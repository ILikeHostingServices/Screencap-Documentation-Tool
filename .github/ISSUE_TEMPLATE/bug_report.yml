# bug_report.yml
# 2026-10-10
# Version: v1.0.0
#
# PURPOSE:
# GitHub issue form for problem reports (Help > Report a Problem in the GUI).

name: Report a problem
description: Something does not work as described in the README.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. **Never attach real recordings or screenshots**: they can show passwords, keys, and internal addresses. A synthetic example, or a description, is enough.
        Security problems: report them privately instead (see SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: From Help > About (it can copy all the details for you), the GUI footer, or `screencap --version`.
      placeholder: v1.18.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it is installed
      options:
        - Windows installer (setup.exe)
        - winget
        - Windows portable zip
        - Quick Start install command (Python)
        - Linux or macOS install command
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The preset and settings used, and what kind of recording (length, resolution, what it shows).
      placeholder: |
        1. Preset "Web console"
        2. Processed a 3 minute 1920x1080 recording of a settings page
        3. ...
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant lines from the Log tab or output/screencap.log. Check them for names, addresses, and paths first.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed anything sensitive (passwords, keys, internal host names, IP addresses, user names) from this report.
          required: true
