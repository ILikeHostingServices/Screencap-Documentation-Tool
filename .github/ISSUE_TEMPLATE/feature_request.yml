# feature_request.yml
# 2026-10-10
# Version: v1.0.0
#
# PURPOSE:
# GitHub issue form for ideas and feature requests (Help > Request a Feature).

name: Suggest an idea
description: A new feature, preset, or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or kind of recording, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Rough is fine.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version you use
      placeholder: v1.18.0
